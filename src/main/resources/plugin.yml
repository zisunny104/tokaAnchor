name: tokaAnchor
main: dev.toka.anchor.Main
version: "0.2.3"
api: ["1.0.4"]
load: POSTWORLD
permissions:
  tokaanchor.use:
    description: 查看說明
    default: true
  tokaanchor.ban:
    description: 封禁、解封、查看封禁名單與關聯帳號
    default: op
  tokaanchor.admin:
    description: 排程重啟、清理、維護模式
    default: op
  tokaanchor.keepmode:
    description: 登入後還原離開前的遊戲模式（其他人登入時是伺服器預設模式）
    default: op
  tokaanchor.enter:
    description: "在登入限制（access.mode 設為 linked）開啟時可以進入伺服器"
    default: false
