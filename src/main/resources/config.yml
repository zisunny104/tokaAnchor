language: zh-TW
storage:
  backend: SQLITE
  schema-version: 1
  directory: storage
ban:
  # 顯示在封禁訊息最後一行，例如申訴方式；留空就不顯示。
  appeal: ""
# 關聯帳號：記錄每個帳號登入過的位址與裝置，用來認出同一個人的多個帳號。
link:
  # direct：封禁時一併封禁「位址與裝置都相同」的帳號，且這類帳號登入時也會被擋；
  # 只有位址或只有裝置相同的帳號不會自動封禁，只在封禁後與 /blink 提示。none：完全不自動處理。
  auto-ban: direct
  # 每個帳號最多保留幾個位址與裝置，超過時丟掉最舊的。
  keep: 10
# 排程重啟：每天在指定時間重啟，並倒數通知。
# 多久沒移動算離開（秒）。只判斷狀態；怎麼顯示（例如名牌上的燈）由要用的插件決定。
afk:
  seconds: 300

restart:
  enabled: true
  # 每天的重啟時間（HH:mm，24 小時制，可寫多個）；時區留空用系統時區。
  times: ["03:15"]
  zone: ""
  # 剩下幾秒時在聊天室通知一次，也顯示在畫面頂部；最後 10 秒固定每秒倒數，只顯示在頂部。
  countdown: [300, 60, 30]
  # 停機前把玩家送回這個位址，讓遊戲自動重連；留空就直接停機（填前請確認位址是玩家連得到的）。
  transfer-address: ""
  transfer-port: 19132
# 清理掉落物、經驗球、投射物與沒有名稱標籤的生物（有名字的寵物會保留）。
clean:
  # 清理前的倒數秒數（最短值）；倒數期間可以用 /clean cancel 取消。
  countdown-seconds: 10
  # 每隔幾分鐘自動清理；0 為不自動，只能用 /anchor clean。
  interval-minutes: 0
  items: true
  creatures: true
  projectiles: true
  orbs: true
# 誰可以登入。open：不限制；linked：只有 OP、allow 名單內的名稱，以及在 LuckPerms 有 tokaanchor.enter 權限的玩家能進來
# （把這個權限給「已綁定 Discord」的群組與管理員群組即可，規則跟著群組走）。這會取代遊戲內建的允許清單，開啟後請把 server.properties 的 white-list 關掉。
access:
  mode: open
  allow: []
  message: "需要先綁定 Discord 才能加入，請到 Discord 完成綁定後再來。"
# 維護模式：開啟時只有 OP 與 allow 名單內的名稱能登入。也可用 /anchor maintenance on|off 即時切換（重啟後回到這裡的設定）。
maintenance:
  enabled: false
  message: "伺服器維護中，請稍後再來。"
  allow: []

# 玩家輸入 / 時，客戶端列出的指令清單。aliases 的簡稱與全稱會一起塞滿畫面：hide-aliases 為 true 時只列主名稱，簡稱仍然可以輸入使用。
# hide 列出完全不顯示在清單、但仍可輸入使用的指令名稱（例如簡短的管理指令、舊習慣的指令）。
commands:
  hide-aliases: true
  hide: [b, ub, blist, blink, c, bal, money, topmoney, seemoney, givemoney, takemoney, setmoney]

# 以 /c 對「不在線但認得的玩家」下的指令會先排隊，等那位玩家下次登入時以他的身分執行（需要 tokaProfiles 才認得離線玩家）。
run:
  queue:
    # 每位玩家最多同時排幾個指令，滿了就拒絕新的。
    max-per-player: 10
    # 單一指令的最大長度（字元），更長的會被拒絕。
    max-length: 256
    # 排隊超過幾天的指令視為過期，載入資料與該玩家登入時會丟掉。
    max-age-days: 30
    # 玩家登入後等幾個 tick 再執行排隊的指令（20 tick = 1 秒），讓玩家先完成進入世界。
    join-delay-ticks: 10
